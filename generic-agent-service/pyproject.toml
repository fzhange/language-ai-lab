[project]
name = "generic-agent-service"
version = "0.0.0"
description = "A deep agent service (plain deepagents, self-hostable)."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35,<2",
    "cryptography>=50,<51",
    "deepagents>=0.7",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-mcp-adapters>=0.3",
    "langchain-openai>=1.6",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.3,<4",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4"
]
